<script>
document.addEventListener('DOMContentLoaded', function() {
  document.documentElement.style.setProperty('--global-theme-color', '#e8612c');
  var s = document.createElement('style');
  s.textContent = '.dropdown-item:hover,.dropdown-item:focus,.dropdown-item.active{color:#e8612c!important}.navbar .nav-link:hover{color:#e8612c!important}';
  document.head.appendChild(s);
});
</script>
